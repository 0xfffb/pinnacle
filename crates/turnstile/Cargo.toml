[package]
name = "pinnacle-turnstile"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Anti-bot turnstile: policy, detector, challenge orchestration"

[[bin]]
name = "pinnacled"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
bytes = "1"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
http = "1"
pingora = { version = "0.9", features = ["proxy"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower = { version = "0.5", features = ["util"] }
pinnacle-control = { path = "../control" }
pinnacle-core = { path = "../core" }
pinnacle-gateway = { path = "../gateway" }
pinnacle-store = { path = "../store" }
